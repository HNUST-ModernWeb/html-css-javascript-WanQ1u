<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>高级Web · 个人信息卡片</title>
  <!-- 使用柔和的字体，提升视觉效果 -->
  <style>
    /* ----- 全局样式 & CSS变量 (便于主题切换) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #e2e8ed 0%, #cbd5e1 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.3s ease;
    }

    /* 深色主题变量 (通过js切换body上的data-theme) */
    body[data-theme="dark"] {
      background: linear-gradient(145deg, #1a222b 0%, #26323f 100%);
    }

    /* 主卡片容器 — 居中、圆角、阴影、微动画 */
    .card {
      max-width: 480px;
      width: 100%;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      box-shadow: 0 20px 35px -8px rgba(0, 10, 30, 0.2), 0 8px 18px -6px rgba(0, 0, 0, 0.05);
      padding: 28px 24px 32px;
      transition: transform 0.25s ease, box-shadow 0.3s ease, background 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    /* 卡片悬停放大 + 加深阴影 (创新加分: 微交互) */
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 40px -12px rgba(0, 20, 50, 0.25), 0 10px 20px -8px rgba(0, 0, 0, 0.1);
    }

    /* 深色模式下卡片背景 */
    body[data-theme="dark"] .card {
      background: rgba(25, 28, 35, 0.8);
      backdrop-filter: blur(8px);
      border-color: rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.5);
    }

    /* 主标题 */
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
      font-size: 2.1rem;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #2a3b5c, #1b2a44);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: background 0.3s;
    }

    body[data-theme="dark"] h1 {
      background: linear-gradient(135deg, #b1c9f0, #d6e2ff);
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* ----- 头像区域 ----- */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 12px;
    }

    /* 圆形头像，带细腻边框 */
    #avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 8px 16px -6px rgba(0, 0, 0, 0.15);
      background: #d9e2f0;
      transition: border 0.2s, box-shadow 0.3s;
    }

    body[data-theme="dark"] #avatar {
      border-color: #3a4055;
      box-shadow: 0 8px 18px -4px #0b0e14;
    }

    /* 上传按钮组 */
    .upload-btn-wrapper {
      display: flex;
      justify-content: center;
    }

    .upload-label {
      background: #eef2f9;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e2b41;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(120, 140, 180, 0.15);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    .upload-label:hover {
      background: #dfe8f5;
      box-shadow: 0 8px 14px -8px rgba(30, 60, 120, 0.2);
      transform: scale(1.02);
      border-color: #9bb1d1;
    }

    body[data-theme="dark"] .upload-label {
      background: #2f3547;
      color: #e0e6f5;
      border-color: #4a5268;
    }

    body[data-theme="dark"] .upload-label:hover {
      background: #3e455b;
    }

    /* 隐藏原生input */
    #avatarUpload {
      display: none;
    }

    /* ----- 信息展示区 (卡片上的姓名/简介展示) ----- */
    .info-display {
      background: rgba(230, 240, 255, 0.4);
      padding: 18px 18px;
      border-radius: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: background 0.3s, border 0.3s;
    }

    body[data-theme="dark"] .info-display {
      background: rgba(20, 25, 38, 0.6);
      border-color: rgba(255, 255, 255, 0.05);
    }

    .info-row {
      display: flex;
      align-items: baseline;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .info-row:last-child {
      margin-bottom: 0;
    }

    .info-label {
      font-weight: 600;
      min-width: 60px;
      color: #1f3a5f;
      font-size: 1.1rem;
    }

    body[data-theme="dark"] .info-label {
      color: #b7c9e8;
    }

    .info-value {
      font-size: 1.2rem;
      font-weight: 500;
      color: #0b1e32;
      word-break: break-word;
      flex: 1;
      padding-left: 8px;
    }

    body[data-theme="dark"] .info-value {
      color: #eef3ff;
    }

    #displayBio {
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: #2c3f5c;
    }

    body[data-theme="dark"] #displayBio {
      color: #ccd9f0;
    }

    /* ----- 编辑区域 (输入框 & 按钮) ----- */
    .edit-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #2c3e5c;
      letter-spacing: 0.3px;
    }

    body[data-theme="dark"] .input-group label {
      color: #b0c2da;
    }

    /* 统一输入框/文本域样式 */
    .modern-input {
      padding: 12px 16px;
      border-radius: 20px;
      border: 1.5px solid #d0ddee;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      font-size: 1rem;
      transition: all 0.2s;
      outline: none;
      color: #121f33;
      resize: vertical;
    }

    .modern-input:focus {
      border-color: #5f8bc9;
      box-shadow: 0 0 0 4px rgba(79, 127, 200, 0.15);
      background: rgba(255, 255, 255, 0.9);
    }

    body[data-theme="dark"] .modern-input {
      background: #262d3e;
      border-color: #444d63;
      color: #ecf2fc;
    }

    body[data-theme="dark"] .modern-input:focus {
      border-color: #7fa1d4;
      box-shadow: 0 0 0 4px rgba(120, 170, 255, 0.2);
      background: #2f374b;
    }

    textarea.modern-input {
      min-height: 80px;
    }

    /* 按钮组 — 保存 & 主题切换 */
    .action-bar {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 40px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      background: white;
      box-shadow: 0 6px 12px -6px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      flex: 1 1 0;
    }

    .btn-primary {
      background: #1f3a6b;
      color: white;
      border: 1px solid #3565a4;
      box-shadow: 0 8px 16px -6px #10233e50;
    }

    .btn-primary:hover {
      background: #254b87;
      transform: scale(1.01);
      box-shadow: 0 12px 20px -10px #0e1e38;
    }

    .btn-secondary {
      background: rgba(240, 245, 255, 0.7);
      color: #1e3557;
      border: 1px solid #b7cbeb;
    }

    .btn-secondary:hover {
      background: rgba(220, 235, 255, 0.9);
      box-shadow: 0 8px 14px -6px #1a3150;
      transform: translateY(-2px);
    }

    body[data-theme="dark"] .btn-primary {
      background: #3a5f8b;
      border-color: #6f98cf;
    }

    body[data-theme="dark"] .btn-primary:hover {
      background: #4c74aa;
    }

    body[data-theme="dark"] .btn-secondary {
      background: #2c3448;
      color: #d2e0ff;
      border-color: #57668b;
    }

    /* 消息提示 (保存反馈) */
    .toast-message {
      margin-top: 14px;
      text-align: center;
      min-height: 28px;
      font-weight: 500;
      color: #1e6f5c;
      transition: opacity 0.2s;
      opacity: 0;
    }

    body[data-theme="dark"] .toast-message {
      color: #9bc7b3;
    }

    .toast-message.show {
      opacity: 1;
    }

    /* 底部点缀 */
    .footer-note {
      margin-top: 16px;
      font-size: 0.8rem;
      opacity: 0.65;
      text-align: center;
    }

    body[data-theme="dark"] .footer-note {
      color: #9aa7c4;
    }
  </style>
</head>
<body>
  <h1>个人信息卡片</h1>

  <!-- 卡片容器 -->
  <div class="card">
    <!-- 头像区域：圆形头像 + 上传按钮 -->
    <div class="avatar-section">
      <div class="avatar-wrapper">
        <!-- 默认头像使用 ui-avatars 生成首字母头像 (稳定、美观) -->
        <img id="avatar" src="myphoto.jpg" alt="个人头像">
      </div>
      <div class="upload-btn-wrapper">
        <label for="avatarUpload" class="upload-label">
          📷 更换头像
        </label>
        <input type="file" id="avatarUpload" accept="image/png, image/jpeg, image/gif, image/webp">
      </div>
    </div>

    <!-- 信息展示区 (显示保存后的姓名/简介) -->
    <div class="info-display">
      <div class="info-row">
        <span class="info-label">姓名</span>
        <span class="info-value" id="displayName">宛丘</span>
      </div>
      <div class="info-row">
        <span class="info-label">简介</span>
        <span class="info-value" id="displayBio">喜欢打瓦</span>
      </div>
    </div>

    <!-- 编辑区域：可编辑姓名、简介、保存按钮等 -->
    <div class="edit-section">
      <div class="input-group">
        <label for="nameInput">✏️ 编辑姓名</label>
        <input type="text" id="nameInput" class="modern-input" placeholder="输入你的姓名" value="宛丘" maxlength="30">
      </div>
      <div class="input-group">
        <label for="bioInput">📝 编辑简介</label>
        <textarea id="bioInput" class="modern-input" placeholder="写一段自我介绍...">喜欢打瓦</textarea>
      </div>

      <!-- 按钮区域: 保存 + 主题切换 (创新加分) -->
      <div class="action-bar">
        <button class="btn btn-primary" id="saveBtn">💾 保存修改</button>
        <button class="btn btn-secondary" id="randomBioBtn">🎲 随机签名</button>
        <button class="btn btn-secondary" id="themeToggleBtn">🌙 深色主题</button>
      </div>
      
      <!-- 轻提示 (保存反馈) -->
      <div class="toast-message" id="saveToast">✓ 信息已更新</div>
    </div>
  </div>

  <div class="footer-note">
    ⚡ 点击保存 · 头像实时更新 · 主题随心切换
  </div>

  <script>
    (function(){
      "use strict";

      // ---------- DOM 元素 ----------
      const avatarImg = document.getElementById('avatar');
      const avatarUpload = document.getElementById('avatarUpload');
      
      // 展示区
      const displayName = document.getElementById('displayName');
      const displayBio = document.getElementById('displayBio');
      
      // 输入区
      const nameInput = document.getElementById('nameInput');
      const bioInput = document.getElementById('bioInput');
      
      // 按钮
      const saveBtn = document.getElementById('saveBtn');
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      
      // 提示消息
      const toastMsg = document.getElementById('saveToast');

      // 当前主题状态 (默认浅色)
      let isDark = false;

      // ---------- 辅助函数：显示短暂提示 (创新小细节) ----------
      function showToast(text, duration = 1800) {
        toastMsg.textContent = text || '✓ 已保存';
        toastMsg.classList.add('show');
        clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(() => {
          toastMsg.classList.remove('show');
        }, duration);
      }

      // ---------- 1. 头像上传：实时更新 (满足头像上传功能) ----------
      avatarUpload.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        // 简单校验文件类型 (image)
        if (!file.type.startsWith('image/')) {
          showToast('⚠️ 请选择图片文件', 1500);
          avatarUpload.value = ''; // 清空
          return;
        }

        // 使用 FileReader 读取并设置为头像
        const reader = new FileReader();
        reader.onload = function(e) {
          avatarImg.src = e.target.result;
          // 可选小反馈: 显示“头像已更新”
          showToast('🖼️ 头像已更新', 1200);
        };
        reader.readAsDataURL(file);
        
        // 允许再次选择同一文件时也能触发 (重置input)
        // 但为了避免change不触发，我们可以在读取后不立即清空，但下次选同文件仍会触发。
      });

      // ---------- 2. 保存功能：将输入框内容更新到展示区 ----------
      function updateDisplayFromInputs() {
        const newName = nameInput.value.trim();
        const newBio = bioInput.value.trim();
        
        // 如果姓名为空，给一个默认占位 (但允许为空字符串? 为了美观，给个提示)
        if (newName === '') {
          displayName.textContent = '未命名';
        } else {
          displayName.textContent = newName;
        }
        
        if (newBio === '') {
          displayBio.textContent = '暂无简介';
        } else {
          displayBio.textContent = newBio;
        }
      }

      // 保存按钮点击事件
      saveBtn.addEventListener('click', function() {
        updateDisplayFromInputs();
        showToast('✅ 卡片信息已保存', 1500);
        
        // 附加小动画: 卡片轻微闪烁 (创新加分细节)
        const card = document.querySelector('.card');
        card.style.transition = 'box-shadow 0.15s, transform 0.15s';
        card.style.boxShadow = '0 0 0 3px rgba(79, 140, 255, 0.3), 0 20px 35px -8px rgba(0,10,30,0.2)';
        setTimeout(() => {
          card.style.boxShadow = ''; // 恢复原样式 (由CSS接管)
        }, 200);
      });

      // 初始化展示区与输入框同步 (确保打开页面时一致，但输入框已有value)
      // 但以防万一，主动同步一次 (让展示区显示和输入框默认值一致)
      function syncDisplayWithInputs() {
        displayName.textContent = nameInput.value.trim() || '未命名';
        displayBio.textContent = bioInput.value.trim() || '暂无简介';
      }
      syncDisplayWithInputs();  // 页面加载完成立即同步

      // ---------- 3. 主题切换 (创新加分: 深色/浅色模式) ----------
      function setTheme(dark) {
        const body = document.body;
        if (dark) {
          body.setAttribute('data-theme', 'dark');
          themeToggleBtn.innerHTML = '☀️ 浅色主题';
          isDark = true;
        } else {
          body.removeAttribute('data-theme');
          themeToggleBtn.innerHTML = '🌙 深色主题';
          isDark = false;
        }
      }

      themeToggleBtn.addEventListener('click', function() {
        setTheme(!isDark);
        // 切换时也显示小提示 (可选)
        showToast(isDark ? '🌙 深色模式已启用' : '☀️ 浅色模式已启用', 1200);
      });

	// ---------- 🎲 创新加分：随机签名生成器 ----------
	const randomBioBtn = document.getElementById('randomBioBtn');

	// 预设一组有趣、文艺、程序员风格的简介库
	const bioLibrary = [
  	"✨ 代码如诗，简洁即正义。",
  	"☕ 咖啡因驱动的开发者。",
  	"🌱 终身学习，保持好奇。",
 	 "🎨 设计是灵魂，代码是骨架。",
 	 "🚀 正在前往星辰大海的途中。",
	  "💡 每一个 bug 都是成长的契机。",
 	 "📚 阅读、思考、创造。",
 	 "🎧 音乐 + 代码 = 心流状态。",
 	 "🧘 保持简单，保持优雅。",
 	 "⚡ 少即是多，慢即是快。",
 	 "🌙 深夜写代码，灵感会发光。",
	  "🧩 把复杂的问题拆解成简单的模块。"
	];

	randomBioBtn.addEventListener('click', function() {
	  // 随机选取一条
	  const randomIndex = Math.floor(Math.random() * bioLibrary.length);
	  const randomBio = bioLibrary[randomIndex];
  
	  // 填入简介输入框
 	 bioInput.value = randomBio;
  
 	 // 可选：给一个小提示（显示选中的是哪条，或者简单震动一下按钮）
  	showToast(`🎲 新签名：${randomBio.substring(0, 20)}…`, 1200);
  
  	// 附加微动画：按钮短暂变色
  	randomBioBtn.style.transform = 'scale(0.97)';
  	setTimeout(() => randomBioBtn.style.transform = '', 120);
	});
      
      // ---------- 4. 额外细节：当输入框内容通过其他方式改变，可预览? 但保存才更新，符合要求。
      // 另外加一个创新：如果用户直接按回车在姓名输入框，可以触发保存？但不是必须，但加上更友好。
      nameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();  // 防止意外提交
          saveBtn.click();
        }
      });
      
      // 简介文本框按 Ctrl+Enter 保存 (小便捷)
      bioInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          saveBtn.click();
        }
      });

      // 可选: 如果用户上传头像后想重置默认头像？不要求，但可以提供一个隐藏功能？不需要。

      // 头像加载失败时，回退到默认文字头像 (使用相同的ui-avatars备用)
      avatarImg.addEventListener('error', function() {
        // 如果默认图片加载失败 (极少情况), 设置一个内联svg或者备用
        this.src = 'https://ui-avatars.com/api/?name=User&size=120&background=556b8d&color=fff&bold=true';
      });

      // 再添加一个小优化：保存后如果姓名/简介输入框与展示不同？但没关系，已经一致。
      
      // 在页面完全加载后显示一句欢迎 (控制台不必要)
      console.log(' 个人信息卡片已加载 — 高级Web第一次作业');
      
      // 创新加分: 卡片加载时淡入 (已经通过css默认可见, 加一点入场动画)
      // 实际上body直接显示，但可以加一个类
      
      // 可选：当修改输入框时，如果想实时预览？但题目要求保存才显示，严格遵守。
      // 因此不做实时预览。
      
      // 但为了更好的体验，我们加一个功能：当输入框内容变化时，可以有一个“未保存”的小标记？不做太复杂。
      // 主题切换按钮图标变化已经做了。

      // 如果用户点击“更换头像”但没选文件，不做任何事。已经ok。
      
      // 此外，如果上传图片后想恢复默认？不需要。但可加一个小彩蛋：双击头像重置为默认？
      // 作为隐藏创新，不干扰主要功能。
      avatarImg.addEventListener('dblclick', function() {
        // 重置为默认头像 (首字母)
        this.src = 'https://ui-avatars.com/api/?name=Web+Dev&size=120&background=3A5F8B&color=fff&bold=true&length=2';
        showToast('🔄 头像已重置为默认', 1000);
        avatarUpload.value = ''; // 清空文件选择
      });

      // 初始化主题文字 (确保一致)
      // 已经在setTheme初始调用？但一开始isDark = false，所以按钮文字显示'深色主题'。正确。
      
    })();
  </script>
  <!-- 添加注释：符合高级Web作业要求，结构清晰，包含HTML/CSS/JS，实现头像上传、编辑保存、主题切换等 -->
  <!--
